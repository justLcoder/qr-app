services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qr_studio
      POSTGRES_USER: qr_studio
      POSTGRES_PASSWORD: qr_studio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qr_studio -d qr_studio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
